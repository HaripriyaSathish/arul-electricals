# Apache site config used inside the Docker image (Render).
# /            → React website (built files in /var/www/html)
# /admin/...   → React admin (same index.html — the app handles the route)
# /api/...     → PHP API (backend/index.php)
# /uploads/... → images, served by the PHP backend from Neon

<VirtualHost *:*>
    ServerName localhost
    DocumentRoot /var/www/html

    # Keep the Authorization header so admin logins work
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    RewriteEngine On
    RewriteRule ^/(api|uploads)(/.*)?$ /var/www/backend/index.php [L]

    # Only index.php in the backend is reachable — never .env or source files
    <Directory /var/www/backend>
        Options -Indexes
        AllowOverride None
        Require all denied
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Built JS/CSS files have hashed names → cache for a year
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
